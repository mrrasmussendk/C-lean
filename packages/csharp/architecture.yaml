# Architecture model of the C# package. Only the readers, the writer and the console are effect components.
components:
  - name: effects
    paths: ["src/Gate.CSharp/Effects/**"]
    effect: true
  - name: cli
    paths: ["src/Gate.CSharp/Cli/**"]
  - name: pipeline
    paths: ["src/Gate.CSharp/Pipeline/**"]
  - name: rules
    paths: ["src/Gate.CSharp/rules/**"]
  - name: mutants
    paths: ["src/Gate.CSharp/Mutants/**"]
  - name: tracing
    paths: ["src/Gate.CSharp/Tracing/**"]
  - name: graph
    paths: ["src/Gate.CSharp/Graph/**"]
  - name: output
    paths: ["src/Gate.CSharp/Output/**"]
  - name: loading
    paths: ["src/Gate.CSharp/Loading/**"]
  - name: analysis
    paths: ["src/Gate.CSharp/Analysis/**"]
  - name: config
    paths: ["src/Gate.CSharp/Config/**"]
  - name: model
    paths: ["src/Gate.CSharp/Model/**"]
edges:
  - {from: cli, to: effects}
  - {from: cli, to: pipeline}
  - {from: cli, to: analysis}
  - {from: cli, to: model}
  - {from: effects, to: loading}
  - {from: effects, to: analysis}
  - {from: effects, to: output}
  - {from: effects, to: model}
  - {from: pipeline, to: rules}
  - {from: pipeline, to: graph}
  - {from: pipeline, to: output}
  - {from: pipeline, to: loading}
  - {from: pipeline, to: analysis}
  - {from: pipeline, to: config}
  - {from: pipeline, to: model}
  - {from: pipeline, to: mutants}
  - {from: pipeline, to: tracing}
  - {from: mutants, to: analysis}
  - {from: mutants, to: config}
  - {from: mutants, to: model}
  - {from: mutants, to: tracing}
  - {from: tracing, to: analysis}
  - {from: tracing, to: model}
  - {from: rules, to: analysis}
  - {from: rules, to: config}
  - {from: rules, to: model}
  - {from: graph, to: analysis}
  - {from: graph, to: model}
  - {from: output, to: model}
  - {from: loading, to: analysis}
  - {from: loading, to: config}
  - {from: loading, to: model}
  - {from: analysis, to: config}
  - {from: analysis, to: model}
  - {from: config, to: analysis}
  - {from: config, to: model}
dependencies:
  - {name: Microsoft.CodeAnalysis.CSharp, reason: "the C# parser and semantic model the rules are written against"}
  - {name: YamlDotNet, reason: "YAML reader for gate.yaml, architecture.yaml and the glossary"}
