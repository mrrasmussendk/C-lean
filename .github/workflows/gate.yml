name: gate
on:
  push:
  pull_request:
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - run: dotnet build core -c Release
      - run: npm ci && npm run build
        working-directory: packages/typescript
      # The contract suite, then each native package against the conformance corpus.
      - run: harness/bin/gate-corpus core
      - run: harness/bin/gate-corpus python
      - run: harness/bin/gate-corpus typescript
      - run: harness/bin/gate-corpus csharp
      # Each package's mutant generator, tracing instrumenter and test runner.
      - run: python3 packages/python/checks/check_mutants.py
      - run: python3 packages/python/checks/check_instrument.py
      - run: python3 packages/python/checks/check_unittest.py
      - run: python3 packages/python/checks/check_switch.py
      - run: node packages/typescript/checks/mutants.mjs
      - run: node packages/typescript/checks/instrument.mjs
      - run: node packages/typescript/checks/switch.mjs
      - run: packages/csharp/checks/mutants-check
      - run: packages/csharp/checks/instrument-check
      - run: packages/csharp/checks/switch-check
      # The gate obeys the gate: every part analyzed by its own language's package.
      - run: tools/selfhost
