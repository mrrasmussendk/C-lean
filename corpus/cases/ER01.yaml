suite: ER01
note: 'A statement is a log call when it is a call whose receiver or function name has log, logger, logging, console, print, trace or debug as one of its words, compared without case; words are the parts of an identifier in snake_case or camelCase, so `logger.info` and `printError` are log calls and `catalog.restore` and `showErrorDialog` are not. A catch block only logs when every statement in
  it is a log call, a comment, or a statement that only transfers control without a value: pass, continue, break,
  a bare return, or a return of null/None/undefined.'
cases:
- id: v1-empty
  kind: violating
  description: An empty catch block. One finding on the catch.
- id: v2-only-logs
  kind: violating
  description: A catch block whose only statements are console or logger calls. One finding.
- id: v3-comment-only
  kind: violating
  description: 'A catch block holding only a comment (Python: only pass, with a comment). One finding.'
- id: c1-rethrows
  kind: conforming
  description: A catch block that rethrows.
- id: c2-logs-and-wraps
  kind: conforming
  description: A catch block that logs, then throws a new exception wrapping the caught one.
- id: c3-handles
  kind: conforming
  description: A catch block that assigns state and returns a fallback value.
- id: c4-word-inside-a-name
  kind: conforming
  description: 'The catch of v2-only-logs with its log calls replaced by calls whose names only hold a log word inside
    another word: `catalog.restore`, `dialog.close`, `showErrorDialog`. None is a log call, so the error is handled:
    no finding.'
- id: e1-finally-only
  kind: edge
  description: A try with a finally and no catch. No finding.
- id: e2-no-binding
  kind: edge
  description: A catch clause that binds no exception variable, with an empty body. One finding.
- id: v4-log-then-leave
  kind: violating
  description: 'A catch block that logs and then only leaves: a bare return in a function returning nothing (Python:
    `return` or `return None`), or continue or break in a loop. A statement that only transfers control and carries
    no value does not handle the error: one finding on the catch. (Recorded from a real change; see spec/amendments.md.)'
