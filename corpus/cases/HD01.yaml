suite: HD01
cases:
- id: v1-missing-fields
  kind: violating
  description: A five-parameter function with `gate:allow SZ04` and nothing else above it. One HD01 finding on the
    comment; the SZ04 finding stands.
  rules:
  - HD01
  - SZ04
- id: v2-expired
  kind: violating
  description: A complete suppression for SZ04 with expires=2025-06-30. One HD01 finding; the SZ04 finding stands.
  rules:
  - HD01
  - SZ04
- id: v3-tool-switch
  kind: violating
  description: 'A compiler or linter disable switch (#pragma warning disable, eslint-disable-next-line, # noqa).
    One finding on its line.'
- id: v4-impossible-date
  kind: violating
  rules:
  - HD01
  - SZ04
  description: 'A suppression with every field, whose `expires` has the shape of a date and is none (2099-13-45). It is
    invalid: one HD01 finding on its line, and the finding it names is reported.'
- id: v5-lookalike-fields
  kind: violating
  rules:
  - HD01
  - SZ04
  description: 'A suppression whose fields are spelled `noreason=`, `notexpires=` and `notapprover=`. A longer name that
    ends in a field name is not that field: one HD01 finding for the missing fields, and the finding it names is reported.'
- id: c1-valid
  kind: conforming
  description: A five-parameter function with a complete suppression for SZ04, expires=2099-01-01. No HD01 finding
    and no unsuppressed SZ04 finding.
  rules:
  - HD01
  - SZ04
- id: c2-none
  kind: conforming
  description: Code without suppressions.
- id: c3-prose
  kind: conforming
  description: A comment saying 'the gate must allow this later'. Not a suppression.
- id: e1-unknown-rule
  kind: edge
  description: A complete suppression naming XX99. One finding.
- id: e2-silences-nothing
  kind: edge
  description: 'A complete, unexpired suppression for SZ04 above a two-parameter function. It silences nothing:
    one finding.'
- id: e3-covers-one-line
  kind: edge
  rules:
  - HD01
  - SZ04
  description: 'Two five-parameter functions on adjacent lines, the first with a valid suppression in a comment at the
    end of its line. A suppression covers one line: its own when that line also holds code, otherwise the line below.
    The first function is silenced and the second is reported.'
